name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android 17 (API 37) SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      # The release keystore is never available on CI: the release build is assembled unsigned, which still runs
      # R8 shrinking over Room, WorkManager and kotlinx.serialization.
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --console=plain
